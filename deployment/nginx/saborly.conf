# ============================================================
#  Saborly Flutter Web — Nginx Configuration
#  Domain : saborly.es
#  Server : 161.97.151.182
# ============================================================

# ── Redirect HTTP www → HTTP non-www ────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name www.saborly.es;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 http://saborly.es$request_uri;
}

# ── Redirect HTTP non-www → HTTPS ───────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name saborly.es;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    return 301 https://saborly.es$request_uri;
}

# ── Redirect HTTPS www → HTTPS non-www ──────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.saborly.es;

    ssl_certificate     /etc/letsencrypt/live/saborly.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saborly.es/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://saborly.es$request_uri;
}

# ── Main HTTPS Server Block ───────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name saborly.es;

    root  /var/www/saborly/web;
    index index.html;

    # ── SSL (managed by Certbot) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/saborly.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saborly.es/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Gzip Compression ─────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ── Flutter SPA Routing ───────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Flutter Bootstrap & Service Worker (no-cache) ────────
    location ~* ^/(flutter_bootstrap\.js|flutter_service_worker\.js|flutter\.js|main\.dart\.js|index\.html|manifest\.json|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        # Re-apply security headers (add_header inheritance)
        add_header X-Frame-Options        "SAMEORIGIN"   always;
        add_header X-Content-Type-Options "nosniff"      always;
    }

    # ── Firebase Service Worker (no-cache) ───────────────────
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type  "application/javascript";
    }

    # ── JavaScript files ─────────────────────────────────────
    location ~* \.js$ {
        add_header Content-Type  "application/javascript";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── WebAssembly files ─────────────────────────────────────
    location ~* \.wasm$ {
        add_header Content-Type  "application/wasm";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Static assets (images, fonts, icons) ─────────────────
    location ~* ^/(assets|canvaskit|icons)/(.*)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Favicon ───────────────────────────────────────────────
    location = /favicon.png {
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Disable access to hidden files ────────────────────────
    location ~ /\. {
        deny all;
    }

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/saborly_access.log;
    error_log  /var/log/nginx/saborly_error.log warn;
}
