org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
android.newDsl=false
# Works around a Kotlin incremental-compiler crash ("this and base files have
# different roots") that happens when the project and the Gradle/pub cache
# live on different drive letters (e.g. D:\ project, C:\ pub cache) — a
# known Kotlin/Gradle path-resolution bug, unrelated to app code.
kotlin.incremental=false